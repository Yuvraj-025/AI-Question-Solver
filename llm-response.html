<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="./src/styles/quiet-controls.css" rel="stylesheet" />
    <script src="./src/ui/quiet-controls.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCluely</title>
    <script src="lib/markdown.js"></script>
    <script src="lib/mathrender.js"></script>
    <style>
      /* --------------------------------------------------------------------------
     1. Reset & Root Setup
     -------------------------------------------------------------------------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: transparent !important;
        color: #f8fafc;
        overflow: hidden;
        -webkit-app-region: no-drag;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      /* Utility classes */
      .text-white {
        color: #ffffff;
      }
      .text-gray-300 {
        color: #d1d5db;
      }
      .text-sm {
        font-size: 0.875rem;
      }
      .font-medium {
        font-weight: 500;
      }
      .mr-2 {
        margin-right: 0.5rem;
      }
      .hidden {
        display: none !important;
      }
      .visible {
        display: block !important;
      }

      /* --------------------------------------------------------------------------
     2. Window Shell & Drag Bar
     -------------------------------------------------------------------------- */
      .main-container {
        width: 100vw;
        height: 100vh;
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: rgba(15, 23, 42, 0.42);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      }

      .window-header {
        position: relative;
        height: 32px;
        flex-shrink: 0;
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 50;
        color: #e2e8f0;
        font-size: 12px;
        letter-spacing: 0.3px;
      }

      .window-title {
        pointer-events: none;
        user-select: none;
        opacity: 0.9;
        font-weight: 500;
      }

      .window-controls {
        display: flex;
        gap: 6px;
        -webkit-app-region: no-drag;
      }

      .window-btn {
        width: 20px;
        height: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        color: #cbd5e1;
        border: 1px solid rgba(255, 255, 255, 0.12);
        cursor: pointer;
        font-weight: 600;
        line-height: 1;
        transition: all 0.15s ease;
      }

      .window-btn:hover {
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
      }

      .window-btn-close:hover {
        background: rgba(239, 68, 68, 0.4);
        border-color: rgba(239, 68, 68, 0.6);
        color: #ffffff;
      }

      /* --------------------------------------------------------------------------
     3. Content Layouts
     -------------------------------------------------------------------------- */
      .content-area {
        flex: 1;
        min-height: 0;
        height: calc(100vh - 32px);
        position: relative;
        -webkit-app-region: no-drag;
      }

      /* Split layout (Text + Code) */
      .split-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        height: 100%;
        padding: 0.75rem;
        overflow: hidden;
      }

      .text-panel,
      .code-panel {
        background: rgba(15, 23, 42, 0.48);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        overflow: hidden;
        position: relative;
        min-height: 0;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .panel-content {
        height: 100%;
        overflow-y: auto;
        overflow-x: auto;
        padding: 1rem;
        scroll-behavior: smooth;
        background: transparent;
      }

      /* Full Content Mode (Text Only) */
      .full-content {
        height: 100%;
        padding: 0.75rem;
        overflow: hidden;
        position: relative;
      }

      .full-content-inner {
        height: 100%;
        background: rgba(15, 23, 42, 0.48);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        overflow-y: auto;
        overflow-x: hidden;
        padding: 1rem 1.25rem;
        scroll-behavior: smooth;
      }

      /* Scrollbar Aesthetics */
      .panel-content::-webkit-scrollbar,
      .full-content-inner::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .panel-content::-webkit-scrollbar-track,
      .full-content-inner::-webkit-scrollbar-track {
        background: transparent;
      }
      .panel-content::-webkit-scrollbar-thumb,
      .full-content-inner::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 999px;
      }
      .panel-content::-webkit-scrollbar-thumb:hover,
      .full-content-inner::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.35);
      }

      /* --------------------------------------------------------------------------
     4. Typography & High Legibility Styles
     -------------------------------------------------------------------------- */
      .markdown-content {
        line-height: 1.6;
        color: #f8fafc;
        font-size: 0.875rem;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
      }

      .markdown-content h1,
      .markdown-content h2,
      .markdown-content h3 {
        margin-top: 1rem;
        margin-bottom: 0.6rem;
        font-weight: 700;
        color: #ffffff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      .markdown-content h1 {
        font-size: 1.25rem;
      }
      .markdown-content h2 {
        font-size: 1.1rem;
      }
      .markdown-content h3 {
        font-size: 0.95rem;
      }

      .markdown-content p {
        margin-bottom: 0.75rem;
        color: #f1f5f9;
      }

      .markdown-content ul,
      .markdown-content ol {
        margin-bottom: 0.75rem;
        padding-left: 1.25rem;
      }

      .markdown-content li {
        margin-bottom: 0.35rem;
        color: #f1f5f9;
      }

      .markdown-content code {
        background-color: rgba(2, 6, 23, 0.75);
        padding: 0.2rem 0.4rem;
        border-radius: 0.25rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-family: "Courier New", monospace;
        font-size: 0.825rem;
        color: #93c5fd;
      }

      .markdown-content pre {
        background-color: rgba(2, 6, 23, 0.85);
        padding: 1rem;
        border-radius: 0.5rem;
        margin: 0.85rem 0;
        overflow-x: auto;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .markdown-content pre code {
        background-color: transparent;
        border: none;
        padding: 0;
        color: #e2e8f0;
      }

      .markdown-content blockquote {
        border-left: 3px solid #38bdf8;
        background: rgba(15, 23, 42, 0.3);
        padding: 0.5rem 0.75rem;
        margin: 0.75rem 0;
        font-style: italic;
        color: #cbd5e1;
        border-radius: 0 4px 4px 0;
      }

      .math {
        font-family:
          "Cambria Math", "STIX Two Math", "Latin Modern Math", Georgia, serif;
        white-space: nowrap;
      }

      .markdown-content sup,
      .markdown-content sub {
        font-size: 0.72em;
        line-height: 0;
      }

      /* --------------------------------------------------------------------------
     5. Code Blocks & Copy Button
     -------------------------------------------------------------------------- */
      .code-block {
        background: rgba(2, 6, 23, 0.82);
        margin-bottom: 1rem;
        border-radius: 0.5rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }

      .code-header {
        background: rgba(15, 23, 42, 0.85);
        padding: 0.45rem 0.75rem;
        border-radius: 0.5rem 0.5rem 0 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        font-family: "Courier New", monospace;
        font-size: 0.75rem;
        color: #93c5fd;
        font-weight: 700;
      }

      .code-content {
        padding: 0.85rem;
        overflow-x: auto;
        background: transparent;
      }

      .code-content pre {
        background: transparent;
        border: none;
        margin: 0;
        padding: 0;
      }

      .code-content code {
        background: transparent;
        color: #e2e8f0;
      }

      .no-code {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #94a3b8;
        font-style: italic;
      }

      .copy-btn {
        position: absolute;
        top: 6px;
        right: 6px;
        background: rgba(15, 23, 42, 0.75);
        color: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.18);
        padding: 3px 8px;
        font-size: 11px;
        border-radius: 4px;
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition: all 0.15s ease;
      }

      .copy-btn:hover {
        background: rgba(30, 41, 59, 0.9);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .copy-btn.copied {
        background: rgba(16, 185, 129, 0.85);
        border-color: rgba(16, 185, 129, 0.95);
        color: #ffffff;
      }

      /* --------------------------------------------------------------------------
     6. Loading & Interactive States
     -------------------------------------------------------------------------- */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: calc(100vh - 32px);
        background: transparent;
      }

      .loading-compact {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 8px 16px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
      }

      .dots-container {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
      }

      .bouncing-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #10b981;
        animation: bounce 1.4s infinite ease-in-out;
      }

      .bouncing-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .bouncing-dot:nth-child(2) {
        animation-delay: -0.16s;
      }
      .bouncing-dot:nth-child(3) {
        animation-delay: 0s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
          opacity: 0.4;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .interactive-scrolling .panel-content,
      .interactive-scrolling .full-content-inner {
        cursor: grab;
      }
      .interactive-scrolling .panel-content:active,
      .interactive-scrolling .full-content-inner:active {
        cursor: grabbing;
      }

      /* --------------------------------------------------------------------------
     7. Prism Code Highlighting Overrides
     -------------------------------------------------------------------------- */
      .token.comment,
      .token.prolog,
      .token.doctype,
      .token.cdata {
        color: #64748b;
      }
      .token.punctuation {
        color: #cbd5e1;
      }
      .token.property,
      .token.tag,
      .token.boolean,
      .token.number,
      .token.constant,
      .token.symbol,
      .token.deleted {
        color: #38bdf8;
      }
      .token.selector,
      .token.attr-name,
      .token.string,
      .token.char,
      .token.builtin,
      .token.inserted {
        color: #4ade80;
      }
      .token.operator,
      .token.entity,
      .token.url,
      .language-css .token.string,
      .style .token.string {
        color: #f43f5e;
      }
      .token.atrule,
      .token.attr-value,
      .token.keyword {
        color: #f43f5e;
      }
      .token.function,
      .token.class-name {
        color: #c084fc;
      }
      .token.regex,
      .token.important,
      .token.variable {
        color: #fb923c;
      }
      .token.important,
      .token.bold {
        font-weight: bold;
      }
      .token.italic {
        font-style: italic;
      }
      .token.entity {
        cursor: help;
      }

      .text-panel,
      .code-panel,
      .full-content-inner {
        height: 100%;
        overflow-y: hidden; /* Scrollbar stays hidden when size matches */
      }

      /* If response exceeds maximum screen boundary (maxAllowedHeight), enable clean scrolling */
      .panel-content,
      .full-content-inner {
        overflow-y: auto;
      }
      body.shortcut-only .main-container { background: rgba(15, 23, 42, .20); }
      body.shortcut-only .text-panel,
      body.shortcut-only .code-panel,
      body.shortcut-only .full-content-inner { background: rgba(15, 23, 42, .16); }
      body.shortcut-only .code-block { background: rgba(2, 6, 23, .28); }
      body.shortcut-only .code-header { background: rgba(15, 23, 42, .20); }
      body.shortcut-only .window-controls,
      body.shortcut-only .copy-btn { display: none; }
      body.shortcut-only .window-header { -webkit-app-region: no-drag; }
      body.shortcut-only .split-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); padding: 8px; gap: 8px; }
      body.shortcut-only .panel-content { padding: 8px; }
      body.shortcut-only .full-content-inner { padding: 10px; }
      body.shortcut-only .code-content { padding: 8px; overflow: visible; }
      body.shortcut-only .code-block { margin-bottom: 8px; }
      body.shortcut-only .code-header { padding: 3px 8px; font-size: 10px; }
      body.shortcut-only .code-content pre,
      body.shortcut-only .code-content code { font-size: var(--answer-font-size, 12px); line-height: 1.25; white-space: pre-wrap; overflow-wrap: anywhere; }
      body.shortcut-only .markdown-content { font-size: var(--answer-font-size, 12px); line-height: 1.4; }
    </style>
  </head>
  <body class="text-white">
    <div class="main-container has-header">
      <!-- Draggable Header -->
      <div class="window-header">
        <div class="window-title">AI Response</div>
        <div class="window-controls">
          <button
            id="close-window-btn"
            class="window-btn window-btn-close"
            title="Close"
          >
            ×
          </button>
        </div>
      </div>

      <!-- Loading State -->
      <div id="loading" class="loading">
        <div class="loading-compact">
          <span class="text-gray-300 text-sm font-medium mr-2">Analyzing</span>
          <div class="dots-container">
            <div class="bouncing-dot"></div>
            <div class="bouncing-dot"></div>
            <div class="bouncing-dot"></div>
          </div>
        </div>
      </div>

      <!-- Response Content -->
      <div id="response-content" class="content-area hidden">
        <!-- Split Layout -->
        <div id="split-layout" class="split-layout hidden">
          <!-- Text Panel -->
          <div class="text-panel">
            <div class="panel-content" tabindex="0">
              <div id="text-content" class="markdown-content"></div>
            </div>
          </div>

          <!-- Code Panel -->
          <div class="code-panel">
            <div class="panel-content" tabindex="0">
              <div id="code-content"></div>
            </div>
          </div>
        </div>

        <!-- Full Content (when no code detected) -->
        <div id="full-content" class="full-content hidden">
          <div class="full-content-inner" tabindex="0">
            <div id="full-markdown" class="markdown-content"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Global variables
      let currentLayout = "split";
      let hasCode = false;
      let currentSkill = "dsa";
      let isInteractive = false;
      let scrollableElements = [];
      let initialized = false;
      let shortcutOnlyMode = false;

      function setShortcutOnlyMode(enabled) {
        shortcutOnlyMode = enabled;
        document.body.classList.toggle('shortcut-only', enabled);
        requestAnimationFrame(autoFitWindowToContent);
      }

      function fitAnswerContent() {
        if (!shortcutOnlyMode) return;
        document.body.style.setProperty('--answer-font-size', '12px');
        const panels = [...document.querySelectorAll('#split-layout:not(.hidden) .panel-content, #full-content:not(.hidden) .full-content-inner')];
        for (let fontSize = 11.5; fontSize >= 10; fontSize -= 0.5) {
          if (panels.every(panel => panel.scrollHeight <= panel.clientHeight + 1)) break;
          document.body.style.setProperty('--answer-font-size', `${fontSize}px`);
        }
      }

      // Immediate logging to verify script execution
      console.log("[LLM-RESPONSE] Script tag executed");

      window.onerror = function (msg, url, line, col, error) {
        console.error("[LLM-RESPONSE] Window error:", msg, "at line", line);
        return false;
      };

      document.addEventListener("DOMContentLoaded", function () {
        console.log("[LLM-RESPONSE] DOMContentLoaded fired");
        initLLMResponseWindow();
      });

      // Also try immediate init in case DOMContentLoaded already fired
      if (
        document.readyState === "complete" ||
        document.readyState === "interactive"
      ) {
        console.log("[LLM-RESPONSE] Document already ready, initializing now");
        setTimeout(initLLMResponseWindow, 0);
      }

      function initLLMResponseWindow() {
        if (initialized) return;
        initialized = true;

        console.log("[LLM-RESPONSE] Initializing window...");

        // Prefer marked when available, but fall back to the bundled markdown.js parser.
        if (typeof marked !== "undefined") {
          marked.setOptions({
            highlight: function (code, lang) {
              if (typeof Prism !== "undefined" && Prism.languages[lang]) {
                return Prism.highlight(code, Prism.languages[lang], lang);
              }
              return code;
            },
            breaks: true,
            gfm: true,
          });
          console.log("[LLM-RESPONSE] marked configured");
        } else if (
          typeof markdown !== "undefined" &&
          typeof markdown.toHTML === "function"
        ) {
          console.log("[LLM-RESPONSE] using bundled markdown.js renderer");
        } else {
          console.error(
            "[LLM-RESPONSE] no markdown renderer available, falling back to plain text",
          );
        }

        console.log("[LLM-RESPONSE] electronAPI exists:", !!window.electronAPI);
        console.log(
          "[LLM-RESPONSE] onDisplayLlmResponse method:",
          typeof window.electronAPI?.onDisplayLlmResponse,
        );

        // Set up event listeners using electronAPI from preload script
        if (window.electronAPI) {
          window.electronAPI.getSettings().then(settings => setShortcutOnlyMode(settings.shortcutOnlyMode === true));
          window.electronAPI.receive('shortcut-only-mode', (_event, enabled) => setShortcutOnlyMode(enabled));
          window.electronAPI.onAnswerPage(direction => {
            document.querySelectorAll('.panel-content, .full-content-inner').forEach(panel => {
              panel.scrollBy({ top: direction * Math.max(80, panel.clientHeight - 30), behavior: 'instant' });
            });
          });
          window.addEventListener('resize', () => requestAnimationFrame(fitAnswerContent));
          console.log("[LLM-RESPONSE] Setting up IPC listeners...");

          // Set up show-loading event listener
          window.electronAPI.onShowLoading(() => {
            console.log("[LLM-RESPONSE] show-loading received");
            showLoadingState();
          });

          // Listen for LLM response
          window.electronAPI.onDisplayLlmResponse(function () {
            console.log(
              "[LLM-RESPONSE] ===== display-llm-response received! =====",
            );
            console.log("[LLM-RESPONSE] arguments count:", arguments.length);

            try {
              // Get the data - could be first or second argument
              let actualData = null;
              if (
                arguments.length >= 2 &&
                arguments[1] &&
                typeof arguments[1] === "object"
              ) {
                actualData = arguments[1];
              } else if (
                arguments.length >= 1 &&
                arguments[0] &&
                typeof arguments[0] === "object"
              ) {
                actualData = arguments[0];
              }

              console.log(
                "[LLM-RESPONSE] actualData keys:",
                actualData ? Object.keys(actualData) : "null",
              );

              const response = actualData?.content || actualData?.response;
              console.log(
                "[LLM-RESPONSE] response found:",
                !!response,
                "length:",
                response?.length,
              );

              if (!response) {
                console.error("[LLM-RESPONSE] No response content found!");
                hideLoadingState();
                return;
              }

              hideLoadingState();
              displayResponse(actualData);
              setupScrolling();
              setTimeout(verifyDisplayState, 500);
              console.log("[LLM-RESPONSE] Handler completed successfully");
            } catch (err) {
              console.error(
                "[LLM-RESPONSE] Error in handler:",
                err.message,
                err.stack,
              );
              hideLoadingState();
            }
          });

          console.log("[LLM-RESPONSE] IPC listeners set up successfully");
        } else {
          console.error("[LLM-RESPONSE] electronAPI not available!");
        }
      } // end initLLMResponseWindow

      function showLoadingState() {
        const loadingElement = document.getElementById("loading");
        const responseElement = document.getElementById("response-content");

        if (loadingElement) {
          loadingElement.classList.remove("hidden");
          loadingElement.style.display = ""; // Remove any forced display styles
        }

        if (responseElement) {
          responseElement.classList.add("hidden");
        }

        console.log("Loading state shown - should see Analyzing...");
      }

      function hideLoadingState() {
        const loadingElement = document.getElementById("loading");
        if (loadingElement) {
          loadingElement.classList.add("hidden");
          loadingElement.style.display = "none"; // Force hide
          console.log("Loading state hidden");
        } else {
          console.error("Loading element not found!");
        }
      }

      function renderMarkdown(text) {
        if (typeof marked !== "undefined") {
          return marked.parse ? marked.parse(text) : marked(text);
        }

        if (
          typeof markdown !== "undefined" &&
          typeof markdown.toHTML === "function"
        ) {
          return markdown.toHTML(text);
        }

        return escapeHtml(text).replace(/\n/g, "<br>");
      }

      function calculateContentMetrics(response, codeBlocks) {
        // Count lines in the response
        const lineCount = response.split("\n").length;

        // Check for long lines (over 80 characters)
        const hasLongLines = response
          .split("\n")
          .some((line) => line.length > 80);

        // Count code blocks
        const codeBlockCount = codeBlocks.length;

        // Estimate content complexity
        const hasCode = codeBlockCount > 0;
        const isLongContent = lineCount > 30;
        const hasMultipleCodeBlocks = codeBlockCount > 2;

        return {
          lineCount,
          hasLongLines,
          codeBlocks: codeBlockCount,
          hasCode,
          isLongContent,
          hasMultipleCodeBlocks,
          complexity:
            isLongContent || hasMultipleCodeBlocks
              ? "high"
              : hasCode
                ? "medium"
                : "low",
        };
      }
      function displayResponse(data) {
        document.body.style.setProperty('--answer-font-size', '12px');
        const responseElement = document.getElementById("response-content");
        if (responseElement) responseElement.classList.remove("hidden");

        const response = data.content || data.response;
        if (!response) return;

        const codeBlocks = extractCodeBlocks(response);
        hasCode = codeBlocks.length > 0;

        if (hasCode) {
          displaySplitLayout(response, codeBlocks);
        } else {
          displayFullLayout(response);
        }

        // Allow DOM and Prism highlighting to finish painting before measuring
        requestAnimationFrame(() => {
          setTimeout(autoFitWindowToContent, 50);
        });
      }

      function autoFitWindowToContent() {
        if (
          !window.electronAPI ||
          !window.electronAPI.resizeLlmWindowForContent
        )
          return;

        const headerHeight = 32;
        const layoutPadding = 24; // Padding & borders
        let requiredContentHeight = 0;

        if (hasCode) {
          // In split layout, take whichever panel is taller
          const textEl = document.getElementById("text-content");
          const codeEl = document.getElementById("code-content");
          const textHeight = textEl ? textEl.scrollHeight : 0;
          const codeHeight = codeEl ? codeEl.scrollHeight : 0;
          requiredContentHeight = Math.max(textHeight, codeHeight);
        } else {
          const fullEl = document.getElementById("full-markdown");
          requiredContentHeight = fullEl ? fullEl.scrollHeight : 0;
        }

        // Header + internal content height + safety buffer
        const calculatedHeight = Math.ceil(
          requiredContentHeight + headerHeight + layoutPadding,
        );

        // Send exact required pixel height to Electron
        window.electronAPI.resizeLlmWindowForContent({
          height: calculatedHeight,
        }).then(() => requestAnimationFrame(fitAnswerContent));
      }

      function setupScrolling() {
        // Set up scrollable elements based on current layout
        setTimeout(() => {
          if (hasCode) {
            scrollableElements = [
              document.querySelector(".text-panel .panel-content"),
              document.querySelector(".code-panel .panel-content"),
            ].filter((el) => el !== null);
          } else {
            scrollableElements = [
              document.querySelector(".full-content-inner"),
            ].filter((el) => el !== null);
          }
          // Reset scroll positions and ensure elements are focusable
          scrollableElements.forEach((element) => {
            element.scrollTop = 0;
            element.scrollLeft = 0;
            element.setAttribute("tabindex", "0");
          });

          // Enable scrolling if interactive mode is on
          if (isInteractive) {
            enableScrolling();
          }
        }, 100);
      }

      function enableScrolling() {
        scrollableElements.forEach((element) => {
          if (element) {
            // Enable mouse/trackpad scrolling with smooth behavior
            element.style.scrollBehavior = "smooth";

            // Add mouse enter handler to ensure focus for scrolling
            element.addEventListener("mouseenter", handleMouseEnter, {
              passive: true,
            });
            element.addEventListener("mouseleave", handleMouseLeave, {
              passive: true,
            });

            // Add wheel event for enhanced scrolling
            element.addEventListener("wheel", handleWheelScroll, {
              passive: false,
            });
          }
        });
      }

      function disableScrolling() {
        scrollableElements.forEach((element) => {
          if (element) {
            element.removeEventListener("mouseenter", handleMouseEnter);
            element.removeEventListener("mouseleave", handleMouseLeave);
            element.removeEventListener("wheel", handleWheelScroll);
          }
        });
      }

      function handleMouseEnter(e) {
        // Focus the element for keyboard scrolling and ensure it's ready for mouse scrolling
        e.target.focus({ preventScroll: true });
        e.target.style.cursor = "grab";
      }

      function handleMouseLeave(e) {
        e.target.style.cursor = "default";
      }

      function handleWheelScroll(e) {
        // Allow natural scrolling behavior
        // Don't prevent default to maintain smooth native scrolling
        console.log("Wheel scroll detected on element");
      }

      function extractCodeBlocks(text) {
        const blocks = [];
        if (!text) return blocks;
        const regex = /(```|~~~)([^\n]*)\n([\s\S]*?)\1/g; // supports ```lang and ~~~lang
        let match;
        while ((match = regex.exec(text)) !== null) {
          const info = (match[2] || "").trim();
          const langToken = info.split(/\s+/)[0] || "text";
          blocks.push({
            language: langToken,
            code: match[3],
            fullMatch: match[0],
          });
        }
        return blocks;
      }

      function attachCopy(btn, text) {
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          try {
            let ok = false;
            if (
              window.electronAPI &&
              typeof window.electronAPI.copyToClipboard === "function"
            ) {
              ok = await window.electronAPI.copyToClipboard(text);
            }
            if (!ok) {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(text);
                ok = true;
              } else {
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                ta.remove();
                ok = true;
              }
            }
            if (ok) {
              btn.classList.add("copied");
              const original = btn.textContent;
              btn.textContent = "Copied";
              setTimeout(() => {
                btn.classList.remove("copied");
                btn.textContent = original || "Copy";
              }, 1200);
            }
          } catch (err) {
            console.warn("Copy failed", err);
          }
        });
      }

      function renderCopyButtonsInFullMarkdown(container) {
        // Add copy buttons to all code blocks in full markdown view
        const pres = container.querySelectorAll("pre");
        pres.forEach((pre) => {
          // Avoid duplicate buttons
          if (pre.querySelector(".copy-btn")) return;
          const code = pre.querySelector("code");
          const text = code ? code.textContent : pre.textContent;
          const btn = document.createElement("button");
          btn.className = "copy-btn";
          btn.textContent = "Copy";
          attachCopy(btn, text || "");
          pre.style.position = "relative";
          pre.appendChild(btn);
        });
      }

      function displaySplitLayout(response, codeBlocks) {
        // Show split layout, hide full layout
        document.getElementById("split-layout").classList.remove("hidden");
        document.getElementById("full-content").classList.add("hidden");

        // Remove code blocks from text content
        let textContent = response;
        codeBlocks.forEach((block) => {
          textContent = textContent.replace(block.fullMatch, "");
        });

        // Clean up text content
        textContent = textContent.replace(/\n\s*\n\s*\n/g, "\n\n").trim();

        // Render text content
        const textHtml = renderMarkdown(textContent);
        document.getElementById("text-content").innerHTML = textHtml;
        if (window.renderMathInElement)
          window.renderMathInElement(document.getElementById("text-content"));

        // Render code blocks
        const codeContainer = document.getElementById("code-content");
        codeContainer.innerHTML = "";

        if (codeBlocks.length === 0) {
          codeContainer.innerHTML =
            '<div class="no-code">No code examples found</div>';
        } else {
          codeBlocks.forEach((block, index) => {
            const codeBlock = document.createElement("div");
            codeBlock.className = "code-block";
            codeBlock.innerHTML = `
                        <div class="code-header">${block.language.toUpperCase()}</div>
                        <div class="code-content">
                            <pre><code class="language-${block.language}">${escapeHtml(block.code)}</code></pre>
                        </div>
                    `;
            const pre = codeBlock.querySelector("pre");
            pre.style.position = "relative";
            const btn = document.createElement("button");
            btn.className = "copy-btn";
            btn.textContent = "Copy";
            attachCopy(btn, block.code || "");
            pre.appendChild(btn);

            codeContainer.appendChild(codeBlock);
          });
        }

        // Highlight code if Prism is available
        if (typeof Prism !== "undefined") {
          Prism.highlightAll();
        }
      }

      function displayFullLayout(response) {
        // Show full layout, hide split layout
        document.getElementById("split-layout").classList.add("hidden");
        document.getElementById("full-content").classList.remove("hidden");

        // Render full markdown
        const html = renderMarkdown(response);
        const full = document.getElementById("full-markdown");
        full.innerHTML = html;
        if (window.renderMathInElement) window.renderMathInElement(full);

        // Highlight any code if Prism is available
        if (typeof Prism !== "undefined") {
          Prism.highlightAll();
        }

        // Add copy buttons to code blocks in full view
        const pres = full.querySelectorAll("pre");
        pres.forEach((pre) => {
          if (pre.querySelector(".copy-btn")) return;
          const code = pre.querySelector("code");
          const text = code ? code.textContent : pre.textContent;
          const btn = document.createElement("button");
          btn.className = "copy-btn";
          btn.textContent = "Copy";
          attachCopy(btn, text || "");
          pre.style.position = "relative";
          pre.appendChild(btn);
        });
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // Handle window focus
      window.addEventListener("focus", () => {
        console.log("LLM Response window focused");
      });

      // Handle window close
      window.addEventListener("beforeunload", () => {
        console.log("LLM Response window closing");
      });

      // Add keyboard scrolling support for when interactive
      document.addEventListener("keydown", (e) => {
        if (!isInteractive) return;

        const activeElement = document.activeElement;
        let targetElement = null;

        // Find the currently focused scrollable element
        for (let element of scrollableElements) {
          if (element === activeElement || element.contains(activeElement)) {
            targetElement = element;
            break;
          }
        }

        // Default to first scrollable element if none focused
        if (!targetElement && scrollableElements.length > 0) {
          targetElement = scrollableElements[0];
        }

        if (!targetElement) return;

        const scrollAmount = 50; // Pixels to scroll

        switch (e.key) {
          case "ArrowUp":
            e.preventDefault();
            targetElement.scrollBy({ top: -scrollAmount, behavior: "smooth" });
            break;
          case "ArrowDown":
            e.preventDefault();
            targetElement.scrollBy({ top: scrollAmount, behavior: "smooth" });
            break;
          case "ArrowLeft":
            e.preventDefault();
            targetElement.scrollBy({ left: -scrollAmount, behavior: "smooth" });
            break;
          case "ArrowRight":
            e.preventDefault();
            targetElement.scrollBy({ left: scrollAmount, behavior: "smooth" });
            break;
          case "PageUp":
            e.preventDefault();
            targetElement.scrollBy({
              top: -targetElement.clientHeight * 0.8,
              behavior: "smooth",
            });
            break;
          case "PageDown":
            e.preventDefault();
            targetElement.scrollBy({
              top: targetElement.clientHeight * 0.8,
              behavior: "smooth",
            });
            break;
          case "Home":
            e.preventDefault();
            targetElement.scrollTo({ top: 0, behavior: "smooth" });
            break;
          case "End":
            e.preventDefault();
            targetElement.scrollTo({
              top: targetElement.scrollHeight,
              behavior: "smooth",
            });
            break;
        }
      });

      // Add verification function to ensure content is properly displayed
      function verifyDisplayState() {
        const loadingElement = document.getElementById("loading");
        const responseElement = document.getElementById("response-content");

        const isLoadingHidden = loadingElement
          ? loadingElement.classList.contains("hidden")
          : true;
        const isContentVisible = responseElement
          ? !responseElement.classList.contains("hidden")
          : false;

        console.log("Display state verification:", {
          loadingHidden: isLoadingHidden,
          contentVisible: isContentVisible,
          windowVisible: !document.hidden,
        });

        if (!isLoadingHidden || !isContentVisible) {
          console.warn("Display state inconsistent - forcing correction");
          if (loadingElement) {
            loadingElement.classList.add("hidden");
            loadingElement.style.display = "none";
          }
          if (responseElement) {
            responseElement.classList.remove("hidden");
          }
        }
      }

      // Add global debugging function
      window.debugLLMWindow = function () {
        console.log("=== LLM Window Debug Info ===");
        console.log("Current layout:", currentLayout);
        console.log("Has code:", hasCode);
        console.log("Is interactive:", isInteractive);
        console.log("Scrollable elements:", scrollableElements.length);

        const loadingElement = document.getElementById("loading");
        const responseElement = document.getElementById("response-content");
      };

      // Close button handler
      (function () {
        const btn = document.getElementById("close-window-btn");
        if (btn) {
          btn.addEventListener("click", () => {
            try {
              if (window.electronAPI && window.electronAPI.closeWindow) {
                window.electronAPI.closeWindow();
              } else if (window.api && window.api.send) {
                window.api.send("quit-app");
              } else {
                window.close();
              }
            } catch (e) {
              try {
                window.close();
              } catch (_) {}
            }
          });
        }
      })();
    </script>
  </body>
